name: Deploy

on:
  workflow_dispatch:
    inputs:
      DOCKERFILE_PATH:
        type: string
        description: "Path to the Dockerfile"
        required: true
        default: "dockerfiles/debian_mini"

      IMAGE_SIZE:
        type: string
        description: "Image size, 950M max"
        required: true
        default: "750M"

      DEPLOY_TO_GITHUB_PAGES:
        type: boolean
        description: "Deploy to Github Pages"
        required: true
        default: true

      GITHUB_RELEASE:
        type: boolean
        description: "Create GitHub release"
        required: true
        default: true

jobs:

  guard_clause:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    permissions:
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile path
        shell: bash
        run: |
          if [ ! -f "${{ inputs.DOCKERFILE_PATH }}" ]; then
            echo "::error title=Invalid Dockerfile path::No file found at ${{ inputs.DOCKERFILE_PATH }}"
            exit 1
          fi

      - name: Check GitHub Pages configuration
        if: ${{ inputs.DEPLOY_TO_GITHUB_PAGES }}
        shell: bash
        run: |
          set +e

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pages" > pages_response

          if [ "$?" -ne 0 ]; then
            echo "::error title=GitHub Pages configuration error::Please enable GitHub Pages and select GitHub Actions as the source."
            exit 1
          fi

          if [[ "$(jq --compact-output --raw-output .build_type pages_response)" != "workflow" ]]; then
            echo "::error title=GitHub Pages configuration error::GitHub Pages must use GitHub Actions as its deployment source."
            exit 1
          fi

          rm pages_response
          set -e

  build:
    needs: guard_clause
    runs-on: ubuntu-latest

    env:
      TAG: "ext2-webvm-base-image"
      IMAGE_SIZE: "${{ inputs.IMAGE_SIZE }}"
      DEPLOY_DIR: "/webvm_deploy"

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image name
        run: |
          echo "IMAGE_NAME=$(basename "${{ inputs.DOCKERFILE_PATH }}")_$(date +%Y%m%d)_${{ github.run_id }}.ext2" >> "$GITHUB_ENV"

      - name: Create deployment directory
        run: |
          sudo mkdir -p "$DEPLOY_DIR"

      - name: Build Docker image
        run: |
          docker build \
            . \
            --tag "$TAG" \
            --file "${{ inputs.DOCKERFILE_PATH }}" \
            --platform=i386

      - name: Start Docker container
        run: |
          docker run \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            -d \
            "$TAG"

          echo "CONTAINER_ID=$(docker ps -aq | head -n 1)" >> "$GITHUB_ENV"

      - name: Extract container configuration
        shell: bash
        run: |
          CMD_JSON=$(docker inspect "$CONTAINER_ID" | jq '.[0].Config.Cmd')
          ENTRYPOINT_JSON=$(docker inspect "$CONTAINER_ID" | jq '.[0].Config.Entrypoint')

          if [[ "$ENTRYPOINT_JSON" != "null" && "$CMD_JSON" != "null" ]]; then
            CMD=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Entrypoint')
            ARGS=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Cmd')

          elif [[ "$CMD_JSON" != "null" ]]; then
            CMD=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Cmd[:1]')
            ARGS=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Cmd[1:]')

          else
            CMD=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Entrypoint[:1]')
            ARGS=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Entrypoint[1:]')
          fi

          ENV_JSON=$(docker inspect "$CONTAINER_ID" | jq -c '.[0].Config.Env')
          CWD=$(docker inspect "$CONTAINER_ID" | jq -r '.[0].Config.WorkingDir')

          echo "CMD=$CMD" >> "$GITHUB_ENV"
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "ENV_JSON=$ENV_JSON" >> "$GITHUB_ENV"
          echo "CWD=$CWD" >> "$GITHUB_ENV"

      - name: Create ext2 image
        run: |
          sudo fallocate -l "$IMAGE_SIZE" "$IMAGE_NAME"

          sudo mkfs.ext2 \
            -r 0 \
            "$IMAGE_NAME"

          sudo mount \
            -o loop \
            -t ext2 \
            "$IMAGE_NAME" \
            /mnt

      - name: Export Docker filesystem
        run: |
          sudo docker cp -a "$CONTAINER_ID:/" /mnt/
          sudo umount /mnt

      - name: Split image for WebVM
        run: |
          sudo split \
            "$IMAGE_NAME" \
            "$DEPLOY_DIR/${IMAGE_NAME}.c" \
            -a 6 \
            -b 128k \
            -x \
            --additional-suffix=.txt

          sudo bash -c \
            "stat -c%s '$IMAGE_NAME' > '$DEPLOY_DIR/${IMAGE_NAME}.meta'"

      - name: Configure WebVM
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("config_github_terminal.js")
          text = path.read_text()

          replacements = {
              "IMAGE_URL": '"' + "${IMAGE_NAME}" + '"',
              "CMD": "${CMD}",
              "ARGS": "${ARGS}",
              "ENV": "${ENV_JSON}",
              "CWD": '"' + "${CWD}" + '"',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Install npm dependencies
        run: |
          npm install

      - name: Build WebVM
        run: |
          WEBVM_MODE=github npm run build

      - name: Prepare WebVM deployment
        run: |
          rm -f build/alpine.html

          sudo cp -a build/. "$DEPLOY_DIR/"

      - name: Generate index.list files
        shell: bash
        run: |
          find "$DEPLOY_DIR" -type d -print0 |
          while IFS= read -r -d '' dir; do
            index_list="$dir/index.list"

            rm -f "$index_list"

            ls -A "$dir" |
              tee "$index_list" > /dev/null

            chmod +rw "$index_list"
          done

      # ------------------------------------------------------------
      # Create a self-contained local distribution.
      #
      # This does NOT require Node/npm after release.
      # It only requires a local HTTP server.
      # ------------------------------------------------------------

      - name: Create local distribution
        shell: bash
        run: |
          LOCAL_DIR="$DEPLOY_DIR/webvm-local"

          sudo mkdir -p "$LOCAL_DIR"

          # Copy the complete built WebVM.
          sudo cp -a "$DEPLOY_DIR/." "$LOCAL_DIR/"

          # Remove the local distribution directory from itself.
          sudo rm -rf "$LOCAL_DIR/webvm-local"

          # Put a convenient launcher in the root.
          sudo tee "$LOCAL_DIR/run.sh" > /dev/null <<'EOF'
          #!/usr/bin/env bash
          set -e

          PORT="${1:-8080}"

          echo
          echo "WebVM local server"
          echo "=================="
          echo
          echo "Open:"
          echo "  http://127.0.0.1:$PORT"
          echo
          echo "Press Ctrl+C to stop."
          echo

          if command -v python3 >/dev/null 2>&1; then
              python3 -m http.server "$PORT" --bind 127.0.0.1
          elif command -v python >/dev/null 2>&1; then
              python -m http.server "$PORT" --bind 127.0.0.1
          else
              echo "Python 3 is required."
              exit 1
          fi
          EOF

          sudo chmod +x "$LOCAL_DIR/run.sh"

          # Windows launcher.
          sudo tee "$LOCAL_DIR/run.ps1" > /dev/null <<'EOF'
          param(
              [int]$Port = 8080
          )

          Write-Host ""
          Write-Host "WebVM local server"
          Write-Host "=================="
          Write-Host ""
          Write-Host "Open:"
          Write-Host "  http://127.0.0.1:$Port"
          Write-Host ""
          Write-Host "Press Ctrl+C to stop."
          Write-Host ""

          python -m http.server $Port --bind 127.0.0.1
          EOF

          # README for people downloading the release.
          sudo tee "$LOCAL_DIR/README.txt" > /dev/null <<'EOF'
          WebVM Local Release
          ===================

          Linux:
              ./run.sh

          Linux with a custom port:
              ./run.sh 8081

          Windows PowerShell:
              .\run.ps1

          Windows with a custom port:
              .\run.ps1 -Port 8081

          Then open:

              http://127.0.0.1:8080

          Requirements:
              Python 3
              A modern browser with WebAssembly support.

          No Node.js or npm is required.

          The VM disk is included in this release.
          EOF

      - name: Create local ZIP
        shell: bash
        run: |
          cd "$DEPLOY_DIR"

          zip -r \
            -0 \
            "webvm-local-${IMAGE_NAME%.ext2}.zip" \
            webvm-local

      - name: Create checksums
        shell: bash
        run: |
          cd "$DEPLOY_DIR"

          sha256sum \
            "$IMAGE_NAME" \
            "webvm-local-${IMAGE_NAME%.ext2}.zip" \
            > checksums.txt

      # ------------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------------

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.DEPLOY_TO_GITHUB_PAGES }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        if: ${{ inputs.GITHUB_RELEASE }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ext2_image
          name: WebVM ${{ env.IMAGE_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.DEPLOY_DIR }}/${{ env.IMAGE_NAME }}
            ${{ env.DEPLOY_DIR }}/webvm-local-${{ env.IMAGE_NAME%.ext2 }}.zip
            ${{ env.DEPLOY_DIR }}/checksums.txt

  # --------------------------------------------------------------
  # GitHub Pages deployment
  # --------------------------------------------------------------

  deploy_to_github_pages:
    if: ${{ inputs.DEPLOY_TO_GITHUB_PAGES }}
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
